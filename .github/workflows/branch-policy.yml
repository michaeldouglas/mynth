name: Branch Policy

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read

jobs:
  feature-branch-policy:
    name: Require feature branches
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch naming
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            source_branch="$HEAD_REF"
          else
            source_branch="$REF_NAME"
          fi

          if [[ "$source_branch" != feature/* ]]; then
            echo "Invalid source branch: $source_branch"
            echo "Changes must be developed on feature/<name> branches."
            echo "Direct commits to main and develop are not allowed."
            exit 1
          fi

          echo "Branch policy passed for $source_branch"


