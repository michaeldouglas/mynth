name: Open Develop Pull Request

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-develop-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-develop-pr:
    name: Open PR to develop
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request when missing
        uses: actions/github-script@v7
        with:
          script: |
            const head = context.ref.replace('refs/heads/', '')
            const base = 'develop'
            const { owner, repo } = context.repo

            const { data: openPullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            })

            if (openPullRequests.length > 0) {
              core.info(`An open pull request already exists: #${openPullRequests[0].number}`)
              return
            }

            const commitSubject = context.payload.head_commit?.message
              ?.split('\n', 1)[0]
              ?.trim()
            const title = `${head} -> ${base}`
            const body = [
              '## Automated pull request',
              '',
              `This pull request was opened automatically for pushes to \`${head}\`.`,
              '',
              commitSubject ? `Latest commit: \`${commitSubject}\`` : '',
            ].filter(Boolean).join('\n')

            const { data: pullRequest } = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title,
              body,
            })

            core.info(`Created pull request #${pullRequest.number}: ${pullRequest.html_url}`)
